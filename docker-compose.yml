services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rag:rag@db:5432/rag
      AWS_CONFIG_FILE: /aws/config
      AWS_SHARED_CREDENTIALS_FILE: /aws/credentials
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/storage
      - ${AWS_DIR:-${USERPROFILE:-${HOME}}/.aws}:/aws:ro
    depends_on:
      db:
        condition: service_healthy
    profiles: ["full"]

  test:
    build: ./backend
    image: chatbot_rag_openai-backend
    env_file: .env
    environment:
      ENABLE_OCR: "false"
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:-}
      PIP_ROOT_USER_ACTION: ignore
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/requirements-dev.txt:/app/requirements-dev.txt:ro
      - pip-cache:/root/.cache/pip
    entrypoint:
      - sh
      - -c
      - pip install -q -r requirements-dev.txt && exec python -m pytest -q -p no:cacheprovider "$$@"
      - pytest
    command: ["tests"]
    profiles: ["test"]

volumes:
  pgdata:
  pip-cache:

networks:
  default:
    driver_opts:
      com.docker.network.driver.mtu: ${DOCKER_MTU:-1400}
